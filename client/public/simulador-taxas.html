<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulador de Pagamento em cartão - Energia Solar</title>
<style>
  :root{--green:#00A335;--green-d:#007A39;--blue:#00A335;--blue-d:#007A39;--bg:#f7f7f7;--panel:#ecf0f1;--text:#3E5055;--muted:#666;--border:#d0d7de;--thead:#cfd8dc;--lock-bg:#fff6e5;--lock-border:#f0a500;--lock-text:#8a5a00}
  *{box-sizing:border-box}
  body{font-family:Roboto,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:24px}
  h1{margin:0 0 12px;color:#00A335;font-size:22px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  label{display:block;font-weight:600;margin-top:8px}
  input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:14px}
  .btn-primary{background:var(--green);color:#fff;border:none;cursor:pointer;font-weight:600}.btn-primary:hover{background:var(--green-d)}
  .btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
  .btn-secondary{background:#3E5055;color:#fff;border:none;cursor:pointer;font-weight:600}.btn-secondary:hover{background:#2a3a3f}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:16px}
  .muted{color:#6b7280;font-size:13px}
  table{width:100%;border-collapse:collapse;margin-top:12px;table-layout:auto}
  th,td{border:1px solid var(--border);padding:8px}
  th{background:var(--thead);font-weight:700}
  th, td{ text-align:center; }
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--border);background:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn-line{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .btn-line.right{justify-content:flex-end}
  .small{font-size:12px}
  .hide-on-pdf{} .forpdf .hide-on-pdf{display:none!important}
  .rf-table th, .rf-table td{ text-align:center !important; }
  .locked{background:var(--lock-bg)!important;border-color:var(--lock-border)!important;color:#111827}
  .warn{background:var(--lock-bg)!important;border-color:var(--lock-border)!important;color:#111827}
  .lock-hint{margin-top:6px;font-size:12px;color:var(--lock-text)}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid}
  .badge-lock{background:var(--lock-bg);border-color:var(--lock-border);color:#111827}
  .badge-warn{background:var(--lock-bg);border-color:var(--lock-border);color:#111827}
  .forpdf #pdfArea{background:#fff}
  .forpdf table{font-size:11px}
  .forpdf th,.forpdf td{padding:5px}
  .forpdf.single-mode #cmpTable th,.forpdf.single-mode #cmpTable td{font-size:10px;padding:3px}
  .forpdf .card{margin-top:10px; padding:12px}
  .forpdf #singleCompare .row{grid-template-columns:1fr;gap:6px}
  .forpdf.single-mode #blockProjeto{display:none!important}
  .forpdf tr{break-inside: avoid; page-break-inside: avoid;}
  @media (max-width: 680px){
    body:not(.forpdf) .rf-table{border:0}
    body:not(.forpdf) .rf-table thead{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden}
    body:not(.forpdf) .rf-table, 
    body:not(.forpdf) .rf-table tbody,
    body:not(.forpdf) .rf-table tr,
    body:not(.forpdf) .rf-table td{display:block;width:100%}
    body:not(.forpdf) .rf-table tr{
      margin:10px 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04);
    }
    body:not(.forpdf) .rf-table td{
      border:0;border-bottom:1px solid var(--border);padding:10px 12px;display:grid;grid-template-columns:48% 52%;gap:8px;text-align:left !important;
    }
    body:not(.forpdf) .rf-table td:last-child{border-bottom:0}
    body:not(.forpdf) .rf-table td::before{content:attr(data-label);font-weight:600;color:#374151;}
  }
</style>
</head>
<body>

<h1 class="hide-on-pdf">Simulador de Pagamento em cartão - Energia Solar</h1>

<div id="pdfArea">
  <div class="card" id="blockProjeto">
    <div class="row">
      <div>
        <label>Produtos (R$)</label>
        <input type="number" id="prod" step="0.01" min="0" placeholder=""/>
      </div>
      <div>
        <label>Serviços (R$)</label>
        <input type="number" id="serv" step="0.01" min="0" placeholder=""/>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Quantidade de cartões</label>
        <input type="number" id="nCart" min="1" placeholder=""/>
      </div>
      <div><label>&nbsp;</label>
        <div class="btns">
          <button type="button" class="btn-primary" id="startBtn">Iniciar Simulação</button>
          <button type="button" class="btn-secondary hide-on-pdf" id="restartBtn" style="display:none">Reiniciar</button>
        </div>
      </div>
    </div>
    <div class="muted" id="totalProjetoInfo"></div>
  </div>

  <div id="singleCompare" class="card" style="display:none"></div>
  <div id="wizardContainer"></div>
  <div class="card" id="finalResult" style="display:none"></div>
</div>

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
(function(){
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  function init(){
    const fmt = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format;
    const byId = id => document.getElementById(id);

    const toDirect = url => { const m=(url||'').match(/\/d\/([^/]+)/); return m?`https://drive.google.com/uc?export=download&id=${m[1]}`:url; };
    const HEADER_URL = toDirect('https://drive.google.com/file/d/1Js6acXM9gKyE5ndt3_9cWnOskE0Ar9X5/view?usp=sharing');
    const FOOTER_URL = toDirect('https://drive.google.com/file/d/1R4Hgy09IGn_EVpP4D_44qlZvlf1tLKCb/view?usp=sharing');

    const VISA_MASTER = {1:3.49,2:5.19,3:5.99,4:6.67,5:7.39,6:7.99,7:8.79,8:9.49,9:9.99,10:10.99,11:11.59,12:12.29,13:12.64,14:12.99,15:13.99,16:14.99,17:15.99,18:16.99,19:17.99,20:18.99,21:19.99};
    const AMEX       = {1:4.29,2:5.74,3:6.54,4:7.23,5:7.94,6:8.59,7:9.39,8:9.99,9:10.64,10:11.49,11:12.09,12:12.79,13:13.26,14:14.14,15:15.14,16:16.14,17:17.14,18:18.14,19:19.14,20:20.14,21:21.14};
    const ELO        = {1:4.99,2:6.29,3:7.09,4:7.79,5:8.49,6:9.19,7:9.99,8:10.59,9:11.29,10:11.99,11:12.59,12:13.29,13:14.29,14:15.29,15:16.29,16:17.29,17:18.29,18:19.29,19:20.29,20:21.29,21:22.29};
    const HIPER = {...ELO};
    const TAXAS = {visa:VISA_MASTER,mastercard:VISA_MASTER,amex:AMEX,elo:ELO,hiper:HIPER};

    const prodEl=byId('prod'), servEl=byId('serv'), nCartEl=byId('nCart');
    const startBtn=byId('startBtn'), restartBtn=byId('restartBtn');
    const wizard=byId('wizardContainer'), finalRes=byId('finalResult'), singleCompare=byId('singleCompare');

    let totalProjeto=0, saldoProjeto=0, totalComTaxas=0, passo=0, linhas=[];
    let nCartSel=1;
    let isExporting=false, isSingleMode=false;

    // anti duplo clique: congelar re-render do preview no último cartão durante o clique
    let freezeFinal = false;

    const transacaoPlanilha = (J5, taxaPercent) => { const M=(taxaPercent||0)/100; return (M>=1)?NaN:(J5/(1-M)); };
    const cents = x => Math.round((x + Number.EPSILON) * 100);

    const parseText = raw => {
      if(!raw) return NaN;
      let s = raw.trim().replace(/\s/g,'');
      if (/,/.test(s) && !/\.\d{1,2}$/.test(s)) s = s.replace(/\./g,'').replace(',', '.');
      return parseFloat(s);
    };
    const parseField = el => {
      if (el && el.type === 'number') {
        const v = el.valueAsNumber;
        return (typeof v === 'number' && isFinite(v)) ? v : NaN;
      }
      return parseText((el && el.value) || '');
    };

    // ---- Prefetch header/footer para exportar em 1 clique
    let headerDataCache = null, footerDataCache = null, headerDims = null, footerDims = null;
    (async () => {
      const toDataURL = async (url)=>{
        try{
          const r = await fetch(url,{mode:'cors',credentials:'omit'});
          if(!r.ok) return null;
          const b = await r.blob(); const fr = new FileReader();
          return await new Promise(res=>{ fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
        }catch(e){ return null; }
      };
      const dims = (dataURL)=>new Promise(res=>{
        if(!dataURL) return res(null);
        const img = new Image(); img.onload = ()=>res({w:img.naturalWidth||img.width,h:img.naturalHeight||img.height}); img.src = dataURL;
      });
      headerDataCache = await toDataURL(HEADER_URL);
      footerDataCache = await toDataURL(FOOTER_URL);
      headerDims = await dims(headerDataCache);
      footerDims = await dims(footerDataCache);
    })();

    async function exportPDF(){
      if(isExporting) return; 
      isExporting=true;
      document.querySelectorAll('#btnPDF1,#btnPDF2,#btnPDF2Back').forEach(b=>b && (b.disabled=true));

      const area = document.getElementById('pdfArea');
      area.scrollIntoView({behavior:'instant', block:'start'});

      // contingência: se cache não veio a tempo
      const ensureData = async ()=>{
        if(!headerDataCache || !footerDataCache || !headerDims || !footerDims){
          const fetchAsDataURL = async (url)=>{
            try{
              const r = await fetch(url,{mode:'cors',credentials:'omit'});
              if(!r.ok) return null;
              const b = await r.blob(); const fr = new FileReader();
              return await new Promise(res=>{ fr.onload=()=>res(fr.result); fr.readAsDataURL(b); });
            }catch(e){ return null; }
          };
          const imgDims = (dataURL)=>new Promise(res=>{
            if(!dataURL) return res(null);
            const img = new Image(); img.onload = ()=>res({w:img.naturalWidth||img.width,h:img.naturalHeight||img.height}); img.src = dataURL;
          });
          headerDataCache = headerDataCache || await fetchAsDataURL(HEADER_URL);
          footerDataCache = footerDataCache || await fetchAsDataURL(FOOTER_URL);
          headerDims = headerDims || await imgDims(headerDataCache);
          footerDims = footerDims || await imgDims(footerDataCache);
        }
      };
      await ensureData();

      document.body.classList.add('forpdf');
      if(isSingleMode) document.body.classList.add('single-mode'); else document.body.classList.remove('single-mode');

      const PAGE_W_MM = 210;
      const clamp = (v,min,max)=>Math.max(min,Math.min(max,v||0));
      const headerH = headerDims ? clamp(PAGE_W_MM * (headerDims.h/headerDims.w), 18, 55) : 0;
      const footerH = footerDims ? clamp(PAGE_W_MM * (footerDims.h/footerDims.w), 14, 40) : 0;

      const opt = {
        margin: (headerH||0) ? [headerH+6,10,(footerH||0)+6,10] : [14,10,14,10],
        filename:'Simulação_de_Pagamento_em_Cartão.pdf',
        image:{type:'jpeg',quality:0.98},
        html2canvas:{ scale: Math.max(2, window.devicePixelRatio || 1), useCORS:true, allowTaint:true, background:'#ffffff', scrollX: -window.scrollX, scrollY: -window.scrollY },
        jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},
        pagebreak:{mode:['css','legacy']}
      };

      try{
        await html2pdf().set(opt).from(area).toPdf().get('pdf').then(pdf=>{
          const total = pdf.internal.getNumberOfPages();
          for(let i=1;i<=total;i++){
            pdf.setPage(i);
            const {width,height} = pdf.internal.pageSize;
            if(headerDataCache) pdf.addImage(headerDataCache,'PNG',0,0,width,headerH);
            else { pdf.setFontSize(11); pdf.text('Simulador de Pagamento em cartão - Energia Solar', 10, 10); }
            if(footerDataCache) pdf.addImage(footerDataCache,'PNG',0,height-footerH,width,footerH);
            else { pdf.setFontSize(10); pdf.text(`Página ${i} / ${total}`, width-30, height-10); }
          }
        }).save();
      } finally {
        document.body.classList.remove('forpdf'); document.body.classList.remove('single-mode');
        isExporting=false;
        document.querySelectorAll('#btnPDF1,#btnPDF2,#btnPDF2Back').forEach(b=>b && (b.disabled=false));
      }
    }

    // Delegação de eventos no Resumo Final + antire-render (corrige clique duplo)
    finalRes.addEventListener('click', (e)=>{
      const pdfBtn = e.target.closest('#btnPDF2');
      const backBtn = e.target.closest('#btnPDF2Back');
      if (pdfBtn) {
        exportPDF();
      } else if (backBtn) {
        if (linhas.length>0){
          const prev = linhas.pop();
          saldoProjeto += prev.base; totalComTaxas -= prev.transacao; passo = Math.max(0, passo-1);
          finalRes.style.display='none';
          proximoPasso({base:prev.base,bandeira:prev.bandeira,parcelas:prev.parcelas});
        }
      }
    });
    finalRes.addEventListener('pointerdown', (e)=>{
      if (e.target.closest('#btnPDF2') || e.target.closest('#btnPDF2Back')) {
        freezeFinal = true;
        setTimeout(()=>freezeFinal=false, 500);
      }
    });

    // ===== Validação topo
    startBtn.addEventListener('click', ()=>{
      const P = parseField(prodEl);
      const S = parseField(servEl);
      const nRaw = (nCartEl.value||'').trim();

      if (!isNaN(P) && P<0) { alert('Informe um valor válido (≥ 0) para Produtos.'); return; }
      if (!isNaN(S) && S<0) { alert('Informe um valor válido (≥ 0) para Serviços.'); return; }
      const pVal = isNaN(P)?0:P, sVal=isNaN(S)?0:S;
      if ((isNaN(P)&&isNaN(S)) || (pVal<=0 && sVal<=0)) {
        alert('Preencha pelo menos um dos campos (Produtos ou Serviços) com valor positivo.'); return;
      }
      if ( nRaw==='' || !/^\d+$/.test(nRaw) || parseInt(nRaw,10)<1 ) {
        alert('Informe a quantidade de cartões (mínimo 1).'); return;
      }

      totalProjeto = pVal + sVal;
      saldoProjeto = totalProjeto; totalComTaxas=0; passo=0; linhas=[];
      nCartSel = parseInt(nRaw,10);
      isSingleMode = (nCartSel===1);

      // trava entradas
      prodEl.disabled = true; servEl.disabled = true; nCartEl.disabled = true;

      byId('totalProjetoInfo').textContent=`Valor do Projeto: ${fmt(totalProjeto)}`;
      startBtn.style.display='none'; restartBtn.style.display='inline-block';

      wizard.innerHTML=''; finalRes.style.display='none'; finalRes.innerHTML='';
      if(isSingleMode){ renderSingleCompare(); renderResumoSingle(); } else { singleCompare.style.display='none'; proximoPasso(); }
    });

    restartBtn.addEventListener('click', ()=>{
      byId('startBtn').style.display='inline-block'; restartBtn.style.display='none';
      wizard.innerHTML=''; finalRes.style.display='none'; finalRes.innerHTML='';
      singleCompare.style.display='none'; byId('totalProjetoInfo').textContent='';
      prodEl.value=''; servEl.value=''; nCartEl.value='';
      prodEl.disabled=false; servEl.disabled=false; nCartEl.disabled=false;
      saldoProjeto=0; totalComTaxas=0; passo=0; linhas=[]; isSingleMode=false;
    });

    // ===== 1 cartão: tabela + resumo
    function renderSingleCompare(){
      const brands = `
        <option value="">-- Selecione --</option>
        <option value="visa">Visa</option>
        <option value="mastercard">Mastercard</option>
        <option value="elo">Elo</option>
        <option value="hiper">Hiper</option>
        <option value="amex">Amex</option>`;
      singleCompare.style.display='block';
      singleCompare.innerHTML = `
        <div class="grid2">
          <div><span class="pill">Cartão único</span></div>
          <div class="right muted">Valor do Projeto: <strong>${fmt(totalProjeto)}</strong></div>
        </div>
        <div class="row">
          <div>
            <label>Bandeira</label>
            <select id="bandeira1">${brands}</select>
          </div>
          <div>
            <label class="hide-on-pdf">&nbsp;</label>
            <div class="muted hide-on-pdf">Selecione a bandeira para listar todas as opções de 1 a 21 parcelas.</div>
          </div>
        </div>
        <div id="cmpStatus" class="muted hide-on-pdf" style="margin-top:8px">Aguardando bandeira…</div>
        <div id="cmpTableWrap" style="display:none">
          <table id="cmpTable">
            <thead>
              <tr>
                <th>Parcelas</th>
                <th>Taxa Transação</th>
                <th>Valor Maquininha/Link*</th>
                <th>Parcela</th>
                <th>Taxas</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>`;
      const bandeiraEl = byId('bandeira1');
      const cmpStatus = byId('cmpStatus');
      const cmpTableWrap = byId('cmpTableWrap');
      const tbody = singleCompare.querySelector('#cmpTable tbody');

      function refreshTable(){
        const b = bandeiraEl.value;
        if(!b){ cmpStatus.textContent='Aguardando bandeira…'; cmpTableWrap.style.display='none'; return; }
        const tabela = TAXAS[b] || {};
        const J5 = totalProjeto;
        let rows='';
        for(let n=1;n<=21;n++){
          const taxa=tabela[n]; if(taxa==null) continue;
          const trans=transacaoPlanilha(J5,taxa);
          const parc=trans/n;
          const taxas=trans-J5;
          rows+=`<tr>
            <td>${n}×</td>
            <td>${taxa.toFixed(2)}%</td>
            <td>${fmt(trans)}</td>
            <td>${fmt(parc)}</td>
            <td>${fmt(taxas)}</td>
          </tr>`;
        }
        tbody.innerHTML= rows || `<tr><td colspan="5" style="text-align:center">Nenhuma taxa cadastrada para esta bandeira.</td></tr>`;
        cmpTableWrap.style.display = rows ? 'block' : 'none';
        if(rows){ cmpStatus.textContent=''; }
      }
      bandeiraEl.addEventListener('change', refreshTable);
    }

    function renderResumoSingle(){
      finalRes.style.display='block';
      finalRes.innerHTML = `
        <h2 style="margin:0 0 8px">Resumo Final</h2>
        <div style="margin-top:8px">
          Como é um único cartão, a tabela acima apresenta todas as opções de 1 a 21 vezes, para a escolha da parcela que melhor se encaixa no orçamento familiar ou empresarial. 
          <br/><br/>Lembramos que caso você esteja considerando pegar um empréstimo, a simples análise de crédito já reduz Score e que empréstimos geram endividamento (índice que é consultado por todos os bancos em várias operações financeiras). Lembramos também que as taxas em cartão são mais baratas que empréstimos bancários, não geram cobrança de IOF, e você ainda pode acumular milhas nessa operação!
        </div>
        <div style="margin-top:8px"><em>*Valor que será digitado na maquininha.</em></div>
        <div class="btn-line right hide-on-pdf" style="margin-top:12px; display:flex;">
          <button type="button" id="btnPDF1" class="btn-primary">Exportar PDF</button>
        </div>`;
      const b1 = byId('btnPDF1'); if(b1) b1.addEventListener('click', exportPDF);
    }

    // ===== 2+ cartões (wizard)
    function proximoPasso(prefill){
      if(passo>=nCartSel){ renderResumoMulti(); return; }
      const isLast = (passo === nCartSel-1);

      wizard.innerHTML=`
        <div class="${isLast ? 'card hide-on-pdf' : 'card'}">
          <div class="grid2">
            <div><span class="pill">Cartão ${passo+1} de ${nCartSel}</span></div>
            <div class="right muted">Saldo restante: <strong id="saldoTop">${fmt(saldoProjeto)}</strong></div>
          </div>

          <label id="lblValorCartao">
            Valor deste cartão (R$) — saldo restante: 
            <span id="saldoRestanteLbl" class="small" style="font-weight:700">${fmt(saldoProjeto)}</span>
            <span class="small">(obrigatório)</span>
          </label>

          <input type="number" id="valorDesejado" step="0.01" min="0.01" placeholder="" />

          ${isLast ? `<div class="lock-hint"><span class="badge badge-lock">🔒 saldo restante travado</span> • Este campo usa automaticamente o saldo restante do projeto.</div>` : ''}

          <div id="warnOver" class="lock-hint" style="display:none">
            <span class="badge badge-warn">⚠️</span> <span id="warnMsg"></span>
          </div>

          <div class="row">
            <div>
              <label>Bandeira</label>
              <select id="bandeira">
                <option value="">-- Selecione --</option>
                <option value="visa">Visa</option>
                <option value="mastercard">Mastercard</option>
                <option value="elo">Elo</option>
                <option value="hiper">Hiper</option>
                <option value="amex">Amex</option>
              </select>
            </div>
            <div>
              <label>Parcelas</label>
              <input type="number" id="parcelas" min="1" max="21" placeholder="" />
            </div>
          </div>

          <div id="status" class="muted" style="margin-top:8px">Preencha o Valor, a Bandeira e as Parcelas (Entre 1 e 21 vezes).</div>

          <div id="calc" class="card" style="display:none;background:var(--panel)">
            <div class="row">
              <div>
                <div><strong>Taxa</strong>: <span id="outRate">—</span></div>
                <div><strong>Transação maquininha</strong>: <span id="outTrans">—</span></div>
                <div><strong>Parcela</strong>: <span id="outParc">—</span></div>
              </div>
              <div>
                <div><strong>Taxas deste cartão</strong>: <span id="outTaxas">—</span></div>
                <div><strong>Saldo do Projeto (após este cartão)</strong>: <span id="outSaldo">—</span></div>
                <div><strong>Total com taxas</strong>: <span id="outTotalComp">—</span></div>
              </div>
            </div>
          </div>

          <div class="btn-line" style="margin-top:12px">
            ${!isLast ? `<button type="button" id="btnVoltar" class="btn-secondary" style="visibility:${passo>0?'visible':'hidden'}">Voltar</button>` : `<span></span>`}
            ${isLast
              ? `<span class="small muted" id="infoUltimo">Ajuste a bandeira/parcelas e veja o resumo abaixo em tempo real.</span>`
              : `<button type="button" id="btnProsseguir" class="btn-primary" disabled>Prosseguir</button>`
            }
          </div>
        </div>`;

      const valorDesejadoEl=byId('valorDesejado');
      const bandeiraEl=byId('bandeira');
      const parcelasEl=byId('parcelas');
      const statusEl=byId('status'), calcBox=byId('calc');
      const outRate=byId('outRate'), outTrans=byId('outTrans'), outParc=byId('outParc');
      const outTaxas=byId('outTaxas'), outSaldo=byId('outSaldo'), outTotalComp=byId('outTotalComp');
      const btnVoltar=byId('btnVoltar');
      const btnNext = isLast ? null : byId('btnProsseguir');

      const warnOver = byId('warnOver'); const warnMsg = byId('warnMsg');

      // Último cartão: travado
      if(isLast){
        valorDesejadoEl.value = saldoProjeto.toFixed(2);
        valorDesejadoEl.readOnly = true;
        valorDesejadoEl.classList.add('locked');
        if(warnOver) warnOver.style.display='none';
      }
      if(prefill){
        valorDesejadoEl.value=(prefill.base||'');
        bandeiraEl.value=prefill.bandeira||'';
        parcelasEl.value=prefill.parcelas||'';
      }

      function clearWarn(){
        valorDesejadoEl.classList.remove('warn');
        if(warnOver) warnOver.style.display='none';
      }
      function showWarn(msg){
        if(isLast) return;
        valorDesejadoEl.classList.add('warn');
        if(warnMsg) warnMsg.textContent = msg;
        if(warnOver) warnOver.style.display='block';
      }

      const centsLE = (a,b) => Math.round((a+Number.EPSILON)*100) <= Math.round((b+Number.EPSILON)*100);

      // Debounce para digitação de parcelas (evita interpretar "1" quando o usuário quer "17")
      let debounceTimer=null;
      function onInputDebounced(){ clearTimeout(debounceTimer); debounceTimer=setTimeout(compute, 500); }

      function renderResumoPreview(lastLine){
        let html=`<h2 style="margin:0 0 8px">Resumo Final</h2>
          <table class="rf-table"><thead><tr>
            <th>#</th><th>Valor Base</th><th>Valor Maquininha/Link*</th><th>Bandeira</th>
            <th>Parcelas</th><th>Taxa</th><th>Valor Parcelas</th>
          </tr></thead><tbody>`;
        let somaTrans=0,somaParcelas=0, idx=0;
        for(const r of linhas){
          idx++;
          somaTrans+=r.transacao; somaParcelas+=r.parcela;
          html+=`<tr>
            <td data-label="#">${idx}</td>
            <td data-label="Valor Base">${fmt(r.base)}</td>
            <td data-label="Valor Maquininha/Link*">${fmt(r.transacao)}</td>
            <td data-label="Bandeira">${r.bandeira[0].toUpperCase()+r.bandeira.slice(1)}</td>
            <td data-label="Parcelas">${r.parcelas}×</td>
            <td data-label="Taxa">${r.taxaEfetiva.toFixed(2)}%</td>
            <td data-label="Valor Parcelas">${fmt(r.parcela)}</td>
          </tr>`;
        }
        if(lastLine){
          idx++;
          somaTrans+=lastLine.transacao; somaParcelas+=lastLine.parcela;
          html+=`<tr>
            <td data-label="#">${idx}</td>
            <td data-label="Valor Base">${fmt(lastLine.base)}</td>
            <td data-label="Valor Maquininha/Link*">${fmt(lastLine.transacao)}</td>
            <td data-label="Bandeira">${lastLine.bandeira[0].toUpperCase()+lastLine.bandeira.slice(1)}</td>
            <td data-label="Parcelas">${lastLine.parcelas}×</td>
            <td data-label="Taxa">${lastLine.taxaEfetiva.toFixed(2)}%</td>
            <td data-label="Valor Parcelas">${fmt(lastLine.parcela)}</td>
          </tr>`;
        }
        html+=`</tbody></table>
          <div style="margin-top:6px"><em>*Valor que será digitado na maquininha.<br/><br/>Lembramos que caso você esteja considerando pegar um empréstimo, a simples análise de crédito já reduz Score e que empréstimos geram endividamento (índice que é consultado por todos os bancos em várias operações financeiras). Lembramos também que as taxas em cartão são mais baratas que empréstimos bancários, não geram cobrança de IOF, e você ainda pode acumular milhas nessa operação!</em></div>
          <div class="card" style="margin-top:12px">
            <div><strong>Valor do projeto:</strong> ${fmt(totalProjeto)}</div>
            <div><strong>Valor mensal das Parcelas</strong>: ${fmt(somaParcelas)}</div>
            <div><strong>Total com taxas:</strong> ${fmt(somaTrans)}</div>
          </div>
          <div class="btn-line hide-on-pdf" style="margin-top:12px; display:flex;">
            <button type="button" id="btnPDF2Back" class="btn-secondary">Voltar</button>
            <button type="button" id="btnPDF2" class="btn-primary">Exportar PDF</button>
          </div>`;
        finalRes.innerHTML=html;
        finalRes.style.display='block';
      }

      function compute(){
        // evita re-render do preview exatamente no pressionar do botão (corrige clique duplo)
        if (isLast && freezeFinal) return;

        const val = (valorDesejadoEl.type==='number') ? valorDesejadoEl.valueAsNumber : parseFloat((valorDesejadoEl.value||'').replace(/\./g,'').replace(',', '.'));
        const n   = parseInt(parcelasEl.value);
        const b   = bandeiraEl.value;
        const limite = saldoProjeto;

        if(!isLast && isFinite(val) && Math.round((val+Number.EPSILON)*100) > Math.round((limite+Number.EPSILON)*100)){
          const msg = (passo===0)
            ? `Valor acima do valor do projeto (máximo ${fmt(limite)}).`
            : `Valor acima do saldo restante (máximo ${fmt(limite)}).`;
          showWarn(msg);
          if(btnNext) btnNext.disabled=true;
          calcBox.style.display='none';
          finalRes.style.display='none';
          return;
        }else{
          clearWarn();
        }

        const tabela = TAXAS[b]||{};
        const taxaPercent=tabela[n];
        const ok = isFinite(val)&&val>0&&cents(val)<=cents(limite) && b && Number.isInteger(n)&&n>=1&&n<=21 && taxaPercent!=null;
        if(!ok){
          if(btnNext) btnNext.disabled=true;
          calcBox.style.display='none';
          if(isLast) finalRes.style.display='none';
          return;
        }
        const J5=val, trans=transacaoPlanilha(J5,taxaPercent);
        if(!isFinite(trans)||trans<=0){
          if(btnNext) btnNext.disabled=true;
          calcBox.style.display='none'; 
          if(isLast) finalRes.style.display='none';
          return;
        }
        const parcela=trans/n, taxas=trans-J5;
        outRate.textContent=taxaPercent.toFixed(2)+'%';
        outTrans.textContent=fmt(trans);
        outParc.textContent=`${fmt(parcela)} (${n}×)`;
        outTaxas.textContent=fmt(taxas);
        outSaldo.textContent=fmt(Math.max(saldoProjeto-J5,0));
        outTotalComp.textContent=fmt(totalComTaxas+trans);
        calcBox.style.display='block';

        if(isLast){
          renderResumoPreview({
            base:J5,bandeira:b,parcelas:n,taxaEfetiva:taxaPercent,transacao:trans,parcela:parcela,taxas:taxas
          });
        } else {
          btnNext.disabled=false;
        }
      }

      valorDesejadoEl.addEventListener('input', compute);
      bandeiraEl.addEventListener('change', compute);
      parcelasEl.addEventListener('input', onInputDebounced);
      parcelasEl.addEventListener('change', compute);

      if(valorDesejadoEl.value || prefill) compute();

      if(btnVoltar){
        btnVoltar.addEventListener('click', ()=>{
          if(linhas.length>0){
            const last=linhas.pop();
            passo=Math.max(0,passo-1);
            saldoProjeto += last.base;
            totalComTaxas -= last.transacao;
            finalRes.style.display='none';
            proximoPasso({base:last.base,bandeira:last.bandeira,parcelas:last.parcelas});
          }else{
            passo=Math.max(0,passo-1);
            finalRes.style.display='none';
            proximoPasso();
          }
        });
      }

      if(!isLast){
        btnNext.addEventListener('click', ()=>{
          const n = parseInt(parcelasEl.value);
          const b = bandeiraEl.value;
          const val = (valorDesejadoEl.type==='number') ? valorDesejadoEl.valueAsNumber : parseFloat((valorDesejadoEl.value||'').replace(/\./g,'').replace(',', '.'));
          const taxaPercent = (TAXAS[b]||{})[n];
          if(!isFinite(val)||!b||!Number.isInteger(n)||taxaPercent==null) return;
          const trans=transacaoPlanilha(val,taxaPercent), parcela=trans/n;
          saldoProjeto=Math.max(saldoProjeto-val,0);
          totalComTaxas+=trans;
          linhas.push({idx:passo+1,base:val,bandeira:b,parcelas:n,taxaEfetiva:taxaPercent,transacao:trans,parcela:parcela,taxas:trans-val});
          passo++;
          proximoPasso();
        });
      }
    }

    // ===== Resumo final (comitado)
    function renderResumoMulti(){
      finalRes.style.display='block';
      let html=`<h2 style="margin:0 0 8px">Resumo Final</h2>
        <table class="rf-table"><thead><tr>
          <th>#</th><th>Valor Base</th><th>Valor Maquininha/Link*</th><th>Bandeira</th>
          <th>Parcelas</th><th>Taxa</th><th>Valor Parcelas</th>
        </tr></thead><tbody>`;
      let somaTrans=0,somaParcelas=0;
      for(const r of linhas){
        somaTrans+=r.transacao; somaParcelas+=r.parcela;
        html+=`<tr>
          <td data-label="#">${r.idx}</td>
          <td data-label="Valor Base">${fmt(r.base)}</td>
          <td data-label="Valor Maquininha/Link*">${fmt(r.transacao)}</td>
          <td data-label="Bandeira">${r.bandeira[0].toUpperCase()+r.bandeira.slice(1)}</td>
          <td data-label="Parcelas">${r.parcelas}×</td>
          <td data-label="Taxa">${r.taxaEfetiva.toFixed(2)}%</td>
          <td data-label="Valor Parcelas">${fmt(r.parcela)}</td>
        </tr>`;
      }
      html+=`</tbody></table>
        <div style="margin-top:6px"><em>*Valor que será digitado na maquininha.<br/><br/>Lembramos que caso você esteja considerando pegar um empréstimo, a simples análise de crédito já reduz Score e que empréstimos geram endividamento (índice que é consultado por todos os bancos em várias operações financeiras). Lembramos também que as taxas em cartão são mais baratas que empréstimos bancários, não geram cobrança de IOF, e você ainda pode acumular milhas nessa operação!</em></div>
        <div class="card" style="margin-top:12px">
          <div><strong>Valor do projeto:</strong> ${fmt(totalProjeto)}</div>
          <div><strong>Valor mensal das Parcelas</strong>: ${fmt(somaParcelas)}</div>
          <div><strong>Total com taxas:</strong> ${fmt(somaTrans)}</div>
        </div>
        <div class="btn-line hide-on-pdf" style="margin-top:12px; display:flex;">
          <button type="button" id="btnPDF2Back" class="btn-secondary">Voltar</button>
          <button type="button" id="btnPDF2" class="btn-primary">Exportar PDF</button>
        </div>`;
      finalRes.innerHTML=html;
    }

    window.exportPDF = exportPDF;
  }
})();
</script>
</body>
</html>
